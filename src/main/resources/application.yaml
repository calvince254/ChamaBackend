spring:
  application:
    name: chama

  # Database initialization (fix status column)
  sql:
    init:
      mode: always
      continue-on-error: true

  # MySQL Database Configuration
  datasource:
    url: jdbc:mysql://localhost:3306/chama_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USERNAME:root}
#    password: ${DB_PASSWORD:root}
    password: ${DB_PASSWORD:rootpassword}


  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.MySQLDialect
    open-in-view: false

  jackson:
    serialization:
      write-dates-as-timestamps: false
    date-format: yyyy-MM-dd'T'HH:mm:ss.SSSZ

  # Email Configuration (Gmail example - update with actual SMTP credentials)
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:projectmanagementemtechhouse@gmail.com}
    password: ${MAIL_PASSWORD:znvukcpdurunsbdy}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

# Application settings
app:
  name: Chama Manager

server:
  port: 3324

# JWT Configuration
jwt:
  secret: chama-app-super-secret-key-that-is-at-least-256-bits-long-for-hs256
  expiration: 86400000  # 24 hours in milliseconds

# CORS Configuration
cors:
  allowed-origins: http://localhost:4200,http://localhost:4000,http://62.169.26.189
  allowed-methods: GET,POST,PUT,DELETE,PATCH,OPTIONS
  allowed-headers: "*"
  allow-credentials: true

logging:
  level:
    root: WARN
    com.calpex_technologies.chama: INFO
    com.calpex_technologies.chama.security: DEBUG
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
    org.hibernate.type.descriptor.sql: WARN


