spring:
  application:
    name: chama

  # Database initialization (fix status column)
  sql:
    init:
      mode: always
      continue-on-error: true

  # MySQL Database Configuration
  datasource:
    url: jdbc:mysql://localhost:3306/chamadb?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.MySQLDialect
    open-in-view: false

  jackson:
    serialization:
      write-dates-as-timestamps: false
    date-format: yyyy-MM-dd'T'HH:mm:ss.SSSZ

server:
  port: 3324

# JWT Configuration
jwt:
  secret: chama-app-super-secret-key-that-is-at-least-256-bits-long-for-hs256
  expiration: 86400000  # 24 hours in milliseconds

# CORS Configuration
cors:
  allowed-origins: http://localhost:4200,http://localhost:4000
  allowed-methods: GET,POST,PUT,DELETE,PATCH,OPTIONS
  allowed-headers: "*"
  allow-credentials: true

logging:
  level:
    root: WARN
    com.calpex_technologies.chama: INFO
    com.calpex_technologies.chama.security: DEBUG
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
    org.hibernate.type.descriptor.sql: WARN

---
# Production profile
spring:
  config:
    activate:
      on-profile: prod

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:chamadb}?useSSL=true&serverTimezone=UTC
    username: ${DB_USERNAME:chama}
    password: ${DB_PASSWORD:chama123}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

logging:
  level:
    com.calpex_technologies.chama: INFO
    org.springframework.security: WARN
